function probe(src){
  return new Promise(function(resolve){
    var v=document.createElement('video');
    v.muted=true; v.defaultMuted=true; v.loop=true;
    v.setAttribute('muted',''); v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
    v.style.cssText='position:fixed;left:-9999px;width:120px;height:120px;';
    document.body.appendChild(v);
    var r={ok:false,err:null,playErr:null,w:0};
    v.addEventListener('loadedmetadata',function(){ r.w=v.videoWidth; });
    v.addEventListener('error',function(){ r.err=v.error?(ERRS[v.error.code]||v.error.code):'unknown'; });
    v.src=src; v.load();
    setTimeout(function(){ var p=v.play(); if(p&&p.catch) p.catch(function(e){ r.playErr=(e&&e.name)||String(e); }); },200);
    setTimeout(function(){
      var t1=v.currentTime;
      setTimeout(function(){
        // difference, not ">": these clips loop, so a healthy one wraps to 0
        r.ok = Math.abs(v.currentTime-t1) > 0.02;
        v.removeAttribute('src'); v.load(); v.remove();
        resolve(r);
      },900);
    },2600);
  });
}

function addRow(tb,cells,cls){
  var tr=document.createElement('tr');
  cells.forEach(function(c,i){ var td=document.createElement('td'); td.textContent=c; if(i===cells.length-1&&cls) td.className=cls; tr.appendChild(td); });
  document.getElementById(tb).appendChild(tr);
}

function verdictFrom(res){
  var L=[];
  if(!res.A) return ['NO VIDEO DECODER — even a 160x160 baseline clip will not play.','bad'];
  if(!res.B) L.push('Main profile rejected: encode as Baseline.');
  if(res.C&&!res.D) L.push('1080p rejected while 720p plays: this decoder tops out below 1920x1080.');
  if(res.D&&!res.E) L.push('PORTRAIT IS THE CONSTRAINT. 1920x1080 plays, 1080x1920 does not — the decoder has a maximum HEIGHT of about 1088. Your Kongensgade files are portrait, which is why they fail here and work on the other TVs.');
  if(res.E&&!res.F) L.push('1088x1920 Main fails where 1080x1920 Baseline plays: profile, not shape.');
  if(res.A&&res.B&&res.C&&res.D&&res.E&&res.F) L.push('All six play. Shape, profile and level are all fine — the problem is something specific to the actual file.');
  if(!L.length) L.push('Mixed result — read the table.');
  var bad = !(res.D&&res.E&&res.F);
  return [L.join('  '), bad?'bad':'warn'];
}

    if(i>=CLIPS.length){
      var v=verdictFrom(res);
      var el=document.getElementById('verdict'); el.textContent=v[0]; el.className='verdict '+v[1];
      fetch('config-kongensgade-1.json?_='+Date.now(),{cache:'no-store'})
        .then(function(r){return r.json();})
        .then(function(cfg){
          addRow('rb',['file',(cfg.src||'').split('/').pop()||'(none)']);
          return probe(cfg.src).then(function(r){
            addRow('rb',['result', r.ok?'PLAYS':('FAILED  '+(r.err||'')+(r.playErr?'  play(): '+r.playErr:''))], r.ok?'ok':'bad');
          });
        })
        .catch(function(){ addRow('rb',['config','could not read config-kongensgade-1.json'],'warn'); });
      return;
    }
    var c=CLIPS[i];
    probe('data:video/mp4;base64,'+c.b64).then(function(r){
      res[c.k]=r.ok;
      addRow('tb',[c.k, c.size, c.spec, r.ok?'PLAYS':('FAILED  '+(r.err||'')+(r.playErr?'  play(): '+r.playErr:''))], r.ok?'ok':'bad');
      i++; next();
    });
  })();
})();
</script>
</body>
</html>
