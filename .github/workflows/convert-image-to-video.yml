name: Convert screen image to video

# Triggered remotely by the WordPress panel (kongensgade-screens-panel.php)
# via GitHub's "repository dispatch" API whenever someone picks an image
# (not a video) for a screen. Converts it to a short looping video with
# ffmpeg, uploads that video as a release asset on the v1-media release,
# and updates that screen's config-N.json to point at it -- so the TV
# ends up playing a video instead of showing the image directly (Android
# TV's browser renders static images noticeably softer than video on this
# hardware).
on:
  repository_dispatch:
    types: [convert_image_to_video]

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read inputs
        id: inputs
        run: |
          SCREEN="${{ github.event.client_payload.screen }}"
          IMAGE_URL="${{ github.event.client_payload.image_url }}"
          if [ -z "$SCREEN" ] || [ -z "$IMAGE_URL" ]; then
            echo "Missing screen or image_url in client_payload" >&2
            exit 1
          fi
          echo "screen=$SCREEN" >> "$GITHUB_OUTPUT"
          echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"
          echo "asset_name=screen-${SCREEN}-image.mp4" >> "$GITHUB_OUTPUT"

      - name: Download source image
        run: |
          curl -fL "${{ steps.inputs.outputs.image_url }}" -o source-image
          file source-image

      - name: Convert to video (ffmpeg ships preinstalled on this runner)
        run: |
          ffmpeg -y -loop 1 -i source-image \
            -c:v libx264 -t 8 -pix_fmt yuv420p \
            -vf "scale='min(3840,iw)':'min(2160,ih)':force_original_aspect_ratio=decrease" \
            -movflags +faststart \
            "${{ steps.inputs.outputs.asset_name }}"

      - name: Upload as a release asset (replacing any previous one for this screen)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset v1-media "${{ steps.inputs.outputs.asset_name }}" \
            --repo "${{ github.repository }}" --yes || true
          gh release upload v1-media "${{ steps.inputs.outputs.asset_name }}" \
            --repo "${{ github.repository }}"

      - name: Point config-N.json at the new video
        run: |
          SCREEN="${{ steps.inputs.outputs.screen }}"
          ASSET="${{ steps.inputs.outputs.asset_name }}"
          URL="https://github.com/${{ github.repository }}/releases/download/v1-media/${ASSET}"

          cat > "config-${SCREEN}.json" << EOF
          {
            "type": "video",
            "src": "${URL}"
          }
          EOF

          git config user.name "kongensgade-screens-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "config-${SCREEN}.json"
          git commit -m "Auto-convert Screen ${SCREEN} image to video" || echo "Nothing to commit"
          git push
.github/workflows/convert-image-to-video.yml
