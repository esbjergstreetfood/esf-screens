<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESF Screens</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #media-container {
    width: 100%;
    height: 100%;
  }
  #media-container video,
  #media-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Only ever seen by a person opening this page wrong in a browser —
     a TV pointed at a correct URL never renders this.
     Positioned fixed and over the top of everything: #media-container is
     height:100% and body is overflow:hidden, so an in-flow message would
     be laid out below the fold and be unreachable — i.e. a black screen. */
  #setup-message {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    padding: 6vh 6vw;
    color: #e4e4e7;
    background: #000;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #setup-message h1 { font-size: 22px; margin: 0 0 12px; }
  #setup-message code {
    background: #18181b;
    border-radius: 4px;
    padding: 2px 6px;
    overflow-wrap: anywhere;
  }
  /* Diagnostic overlay, shown only with &debug=1 in the URL. Sized to be
     readable from across a room on a TV, and positioned fixed so it sits
     over the media rather than being pushed below the fold. */
  #debug-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    max-width: 96%;
    margin: 2%;
    padding: 18px 22px;
    background: rgba(0, 0, 0, 0.82);
    border: 2px solid #22d3ee;
    border-radius: 10px;
    color: #f4f4f5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 26px;
    line-height: 1.5;
    white-space: pre;
    z-index: 999;
  }
  #debug-overlay b { color: #22d3ee; }
</style>
</head>
<body>
  <div id="media-container"></div>
  <div id="setup-message">
    <h1>No screen specified</h1>
    <p>This page needs a screen slug in the URL, for example:</p>
    <p><code>?s=kongensgade-1</code></p>
    <p>The exact URL for each screen is listed in WordPress under <strong>ESF Screens → Settings</strong>.</p>
  </div>
  <div id="debug-overlay"></div>

  <script>
    // ---- Generic config-driven kiosk page -------------------------------
    // One page for every screen, replacing the old index-1.html … index-4.html.
    // The screen is chosen by the URL — ?s=<slug>, or the longer
    // ?screen=<slug> — and the page polls config-<slug>.json for what to
    // display.
    //
    // Every CHECK_INTERVAL_MS it re-fetches that config (cache-busted) and
    // swaps the on-screen media if — and only if — the config actually
    // changed, so a poll that returns the same thing never restarts a video.
    //
    // To change what a screen shows: use the WordPress control panel, which
    // writes the config file. Nothing about this HTML file needs to change,
    // and nothing about it is specific to any one screen.

    var CHECK_INTERVAL_MS = 30000;
    var current = null; // last-applied config, so we don't restart media needlessly

    // Read the screen slug from the URL. Both ?s=<slug> and the longer
    // ?screen=<slug> work; ?s= is what goes on the TVs, because the URL
    // gets typed on a d-pad remote and every character is a chore.
    // Anything that isn't a plain lowercase slug is rejected rather than
    // used to build a fetch path.
    function getScreenSlug() {
      // Case-insensitive on the parameter NAME as well as the value: a TV
      // remote's on-screen keyboard often starts in caps, and "?S=" failing
      // silently to a blank screen is a miserable thing to debug on a ladder.
      var match = /[?&]s=([^&#]*)/i.exec(window.location.search)
               || /[?&]screen=([^&#]*)/i.exec(window.location.search);
      if (!match) return null;
      var slug = decodeURIComponent(match[1]).trim().toLowerCase();
      return /^[a-z0-9][a-z0-9-]*$/.test(slug) ? slug : null;
    }

    var SCREEN = getScreenSlug();
    var CONFIG_URL = SCREEN ? 'config-' + SCREEN + '.json' : null;

    // ---- Diagnostic overlay (&debug=1) ---------------------------------
    // Answers questions that can only be answered on the actual hardware:
    // what resolution the kiosk browser is really drawing at, whether the
    // TV's rotate feature rotates the browser viewport or only the output
    // signal, and how the media's shape compares to the viewport's. Off
    // unless explicitly asked for, so a normal screen never shows it.
    var DEBUG = /[?&]debug=1/i.test(window.location.search);
    var lastMediaSize = null; // {w, h, kind} once the media reports its size

    function ratio(w, h) {
      if (!w || !h) return '?';
      return (w / h).toFixed(3) + (w >= h ? '  (landscape)' : '  (portrait)');
    }

    function updateDebug() {
      if (!DEBUG) return;
      var el = document.getElementById('debug-overlay');
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var dpr = window.devicePixelRatio || 1;
      var o = (screen.orientation && screen.orientation.type) || '(not reported)';

      var lines = [
        '<b>screen</b>       ' + (SCREEN || '(none)'),
        '<b>viewport</b>     ' + vw + ' x ' + vh + '  CSS px',
        '<b>ratio</b>        ' + ratio(vw, vh),
        '<b>pixel ratio</b>  ' + dpr,
        '<b>drawn at</b>     ' + Math.round(vw * dpr) + ' x ' + Math.round(vh * dpr) + '  device px',
        '<b>screen obj</b>   ' + screen.width + ' x ' + screen.height,
        '<b>orientation</b>  ' + o,
      ];

      if (lastMediaSize) {
        lines.push('<b>media</b>        ' + lastMediaSize.w + ' x ' + lastMediaSize.h + '  (' + lastMediaSize.kind + ')');
        lines.push('<b>media ratio</b>  ' + ratio(lastMediaSize.w, lastMediaSize.h));
        var mismatch = Math.abs((vw / vh) - (lastMediaSize.w / lastMediaSize.h)) > 0.15;
        lines.push('<b>shape match</b>  ' + (mismatch ? 'NO - media is being cropped' : 'yes'));
      } else {
        lines.push('<b>media</b>        (waiting for it to load)');
      }

      el.innerHTML = lines.join('\n');
      el.style.display = 'block';
    }

    function noteMediaSize(w, h, kind) {
      lastMediaSize = { w: w, h: h, kind: kind };
      updateDebug();
    }

    if (SCREEN) {
      document.title = 'Screen: ' + SCREEN;
    }

    function sameConfig(a, b) {
      return !!a && !!b && a.type === b.type && a.src === b.src;
    }

    function renderVideo(src) {
      var container = document.getElementById('media-container');
      container.innerHTML = '';
      var video = document.createElement('video');
      video.src = src;
      video.autoplay = true;
      video.muted = true;
      video.loop = true;
      video.setAttribute('playsinline', '');

      // Same resilience behaviour as the per-screen pages this replaces.
      video.addEventListener('pause', function () {
        video.play().catch(function () {});
      });
      video.addEventListener('error', function () {
        setTimeout(function () { location.reload(); }, 10000);
      });

      if (DEBUG) {
        video.addEventListener('loadedmetadata', function () {
          noteMediaSize(video.videoWidth, video.videoHeight, 'video');
        });
      }

      container.appendChild(video);
    }

    function renderImage(src) {
      var container = document.getElementById('media-container');
      container.innerHTML = '';
      var img = document.createElement('img');
      img.src = src;
      img.alt = '';
      if (DEBUG) {
        img.addEventListener('load', function () {
          noteMediaSize(img.naturalWidth, img.naturalHeight, 'image');
        });
      }
      container.appendChild(img);
    }

    function applyConfig(config) {
      if (!config || !config.type || !config.src) {
        console.log('Ignoring invalid config:', config);
        return;
      }
      if (sameConfig(config, current)) {
        return; // No change — leave whatever is currently playing/showing alone.
      }
      current = config;
      if (config.type === 'video') {
        renderVideo(config.src);
      } else if (config.type === 'image') {
        renderImage(config.src);
      } else {
        console.log('Unknown media type:', config.type);
      }
    }

    function checkConfig() {
      fetch(CONFIG_URL + '?_=' + Date.now(), { cache: 'no-store' })
        .then(function (res) { return res.json(); })
        .then(applyConfig)
        .catch(function (err) {
          // Network hiccup or bad JSON: keep showing whatever's already on
          // screen rather than blanking it.
          console.log('config check failed', err);
        });
    }

    // If the app/browser gets backgrounded and comes back, make sure video resumes.
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && current && current.type === 'video') {
        var v = document.querySelector('#media-container video');
        if (v) v.play().catch(function () {});
      }
    });

    if (DEBUG) {
      updateDebug();
      window.addEventListener('resize', updateDebug);
      if (screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener('change', updateDebug);
      }
    }

    if (!SCREEN) {
      // No usable slug: show the setup note instead of polling a path that
      // can't exist. A TV is never in this state — only a person testing.
      document.getElementById('setup-message').style.display = 'block';
    } else {
      checkConfig();
      setInterval(checkConfig, CHECK_INTERVAL_MS);
    }
  </script>
</body>
</html>
